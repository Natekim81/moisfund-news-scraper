name: 지방소멸대응기금 뉴스 브리핑

on:
  schedule:
    - cron: '50 23 * * *'  # 한국시간 매일 08:50
    - cron: '50 7 * * *'   # 한국시간 매일 16:50
  workflow_dispatch: {}

permissions:
  contents: write

# 자동·수동 실행이 겹쳐 동일 기사를 동시에 발송하지 않도록 순차 처리
concurrency:
  group: news-briefing-history
  cancel-in-progress: false

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 기본 브랜치의 최신 코드와 발송 이력 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: python -m pip install -r requirements.txt

      - name: 실행 정보 확인
        env:
          NEWS_EVENT: ${{ github.event_name }}
          NEWS_SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "실행 방식: $NEWS_EVENT"
          echo "예약식: $NEWS_SCHEDULE"
          TZ=Asia/Seoul date '+실제 작업 시작: %Y-%m-%d %H:%M:%S KST'

      - name: 뉴스 스크랩 및 텔레그램 전송
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_SCHEDULE: ${{ github.event.schedule }}
          PYTHONUNBUFFERED: '1'
        run: python main.py

      - name: 발송 이력 저장
        if: ${{ always() && !cancelled() }}
        env:
          NEWS_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ ! -f sent_history.json ]; then
            echo "발송 이력 파일이 없어 저장을 건너뜁니다. 앞선 실패 단계를 확인하세요."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- sent_history.json
          if git diff --cached --quiet; then
            echo "발송 이력 변경 없음"
            exit 0
          fi
          git commit -m "chore: update news send history [skip ci]"
          git pull --rebase origin "$NEWS_BRANCH"
          git push origin "HEAD:$NEWS_BRANCH"

      - name: 실패 시 발송 이력 복구용 파일 보관
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: news-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: sent_history.json
          if-no-files-found: ignore
          retention-days: 7
