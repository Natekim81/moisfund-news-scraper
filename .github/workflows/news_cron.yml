name: 지방소멸대응기금 뉴스 브리핑

# [실행 방식]
# 1) 정시 실행: 외부 스케줄러(cron-job.org)가 GitHub API로 workflow_dispatch를
#    호출합니다. slot=am(오전 09시), slot=pm(오후 17시).
#    예약 대기열을 거치지 않아 호출 직후 실행됩니다.
# 2) 백업 실행: 아래 schedule은 외부 호출이 실패한 날을 대비한 예비용입니다.
#    같은 날 같은 회차가 이미 발송됐으면 main.py가 아무것도 보내지 않고 종료합니다.
#    cron 값을 바꾸면 main.py의 BACKUP_CRON_TO_SLOT도 같이 바꿔야 합니다.
# 3) 수동 실행: Actions 화면의 Run workflow에서 slot=manual(기본값)로 실행하면
#    회차와 무관하게 즉시 발송합니다.

on:
  workflow_dispatch:
    inputs:
      slot:
        description: '발송 회차 (manual=수동 즉시 발송, am=오전 회차, pm=오후 회차)'
        required: false
        default: 'manual'
        type: choice
        options:
          - manual
          - am
          - pm
  schedule:
    - cron: '20 0 * * *'  # 백업: 한국시간 09:20 (오전 회차 미발송 시에만 발송)
    - cron: '20 8 * * *'  # 백업: 한국시간 17:20 (오후 회차 미발송 시에만 발송)

permissions:
  contents: write

# 외부 호출·백업·수동 실행이 겹쳐도 순서대로 처리해 중복 발송을 막음
concurrency:
  group: news-briefing-history
  cancel-in-progress: false

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 기본 브랜치의 최신 코드와 발송 이력 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: python -m pip install -r requirements.txt

      - name: 실행 정보 확인
        env:
          NEWS_EVENT: ${{ github.event_name }}
          NEWS_SCHEDULE: ${{ github.event.schedule }}
          NEWS_SLOT: ${{ inputs.slot }}
        run: |
          echo "실행 방식: $NEWS_EVENT"
          echo "회차 입력: ${NEWS_SLOT:--}"
          echo "예약식: ${NEWS_SCHEDULE:--}"
          TZ=Asia/Seoul date '+실제 작업 시작: %Y-%m-%d %H:%M:%S KST'

      - name: 뉴스 스크랩 및 텔레그램 전송
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_SCHEDULE: ${{ github.event.schedule }}
          NEWS_SLOT: ${{ inputs.slot }}
          PYTHONUNBUFFERED: '1'
        run: python main.py

      - name: 발송 이력 저장
        if: ${{ always() && !cancelled() }}
        env:
          NEWS_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ ! -f sent_history.json ]; then
            echo "발송 이력 파일이 없어 저장을 건너뜁니다. 앞선 실패 단계를 확인하세요."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- sent_history.json
          if git diff --cached --quiet; then
            echo "발송 이력 변경 없음"
            exit 0
          fi
          git commit -m "chore: update news send history [skip ci]"
          git pull --rebase origin "$NEWS_BRANCH"
          git push origin "HEAD:$NEWS_BRANCH"

      - name: 실패 시 발송 이력 복구용 파일 보관
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: news-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: sent_history.json
          if-no-files-found: ignore
          retention-days: 7
