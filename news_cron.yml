name: 지방소멸대응기금 뉴스 브리핑

on:
  schedule:
    # UTC 기준 실행 시각 (KST = UTC+9)
    # 23:50 UTC -> 08:50 KST (오전, 최근 16시간 필터)
    # 07:50 UTC -> 16:50 KST (오후, 최근 8시간 필터)
    - cron: '50 23 * * *'
    - cron: '50 7 * * *'

  workflow_dispatch: {}  # 수동 실행 버튼 활성화

permissions:
  contents: write  # sent_history.json을 저장소에 커밋하기 위해 필요

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 뉴스 스크랩 및 텔레그램 전송
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_SCHEDULE: ${{ github.event.schedule }}
        run: python main.py

      - name: 발송 이력 커밋
        if: always()  # main.py가 실패해도 정리된 이력은 최대한 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_history.json
          if git diff --cached --quiet; then
            echo "발송 이력 변경 없음, 커밋 생략"
          else
            git commit -m "chore: 발송 이력 업데이트 [skip ci]"
            git pull --rebase
            git push
          fi
